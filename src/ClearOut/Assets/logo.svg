<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    ClearOut logo — "Primary - Dark Mode" vector master: a dark teal rounded-square
    tile, a gold/tan trash can, and a curved sweeping arrow plunging into the can's
    opening (dust/clutter being swept away). Large, high-contrast shapes with no
    fine detail so it stays legible at 16px (taskbar/Explorer small-icon size).
    This file is the source of truth for edits; tools/generate_icon.py re-derives
    Assets/app.ico (and the Scan/Cleanup + Maintenance feature-icon PNGs, which
    reuse the same can/lid/handle geometry) from the same shapes procedurally
    (no SVG rasterizer is available in the build/dev environment).
  -->

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#138A96" />
      <stop offset="1" stop-color="#0C6D77" />
    </linearGradient>
  </defs>

  <!-- Tile background -->
  <rect x="15" y="15" width="226" height="226" rx="50" fill="url(#tile)" />
  <ellipse cx="128" cy="68" rx="90" ry="38" fill="#FFFFFF" opacity="0.15" />

  <!-- Trash can body (tapered) + ribs -->
  <polygon points="84,102 172,102 158,198 98,198" fill="#DDA15E" stroke="#9F7444" stroke-width="4" stroke-linejoin="round" />
  <g stroke="#9F7444" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="115" x2="110" y2="185" />
    <line x1="128" y1="115" x2="128" y2="185" />
    <line x1="146" y1="115" x2="146" y2="185" />
  </g>

  <!-- Lid + handle -->
  <rect x="76" y="90" width="104" height="12" rx="5" fill="#DDA15E" stroke="#9F7444" stroke-width="4" />
  <rect x="116" y="76" width="24" height="16" rx="4" fill="#DDA15E" stroke="#9F7444" stroke-width="4" />

  <!-- Sweeping arrow, plunging into the can's opening -->
  <path d="M 52,45 Q 145,55 120,97" fill="none" stroke="#DDA15E" stroke-width="12" stroke-linecap="round" />
  <polygon points="107.7,117.6 108.3,85.4 135.8,101.7" fill="#DDA15E" />
</svg>
