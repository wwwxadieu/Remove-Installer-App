<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Remove Installer App logo — vector master.

    Design: an application window (the thing being removed) with a red delete
    badge over its corner. Large, high-contrast shapes with no fine detail so
    it stays legible at 16px (taskbar/Explorer small-icon size). This file is
    the source of truth for edits; tools/generate_icon.py re-derives
    Assets/app.ico from the same shapes procedurally (no SVG rasterizer is
    available in the build/dev environment).
  -->

  <!-- Window body -->
  <rect x="26" y="51" width="174" height="169" rx="23" fill="#3B6FE0" />

  <!-- Window titlebar (rounded top corners only, straight bottom edge) -->
  <path d="
    M 26 74
    A 23 23 0 0 1 49 51
    L 177 51
    A 23 23 0 0 1 200 74
    L 200 86
    L 26 86
    Z"
    fill="#1E4FBF" />

  <!-- Delete badge -->
  <circle cx="205" cy="205" r="61" fill="#E13636" />

  <!-- X mark -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <line x1="183" y1="183" x2="227" y2="227" />
    <line x1="227" y1="183" x2="183" y2="227" />
  </g>
</svg>
