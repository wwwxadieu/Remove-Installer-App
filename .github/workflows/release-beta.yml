name: Build beta release

# Builds a self-contained Windows package and publishes it as a prerelease
# GitHub Release. Three ways to trigger:
#   1. Push a tag matching v*-beta* (e.g. `v1.1.0-beta1`) — fully automatic.
#   2. Run manually from the Actions tab ("Run workflow"), optionally giving
#      an explicit version; if left blank one is generated from the run number.
#   3. Open a PR against main — build-only, no release published (see the
#      `release` job's `if:`). This exists because the app can only be compiled
#      on Windows: without it, a PR that doesn't compile merges cleanly and the
#      breakage is only discovered on the next manual release run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, e.g. 1.1.0-beta1 (leave blank to auto-generate)"
        required: false
        type: string
  push:
    tags:
      - "v*-beta*"
  pull_request:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Compute version
        id: compute
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="0.0.0-beta.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      # Keep both legs running independently: a failure on the experimental arm64 leg
      # must not cancel (or block the release of) the x64 build.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            experimental: false
          - rid: win-arm64
            platform: arm64
            experimental: true
    # arm64 has no hosted Windows runner and is cross-compiled here, so treat it as
    # best-effort: if it breaks, the release still ships with the x64 asset.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pins the SDK to the 8.x band the project targets, so the build
      # doesn't silently drift onto whatever newer SDK the runner image ships.
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show resolved SDK
        run: dotnet --version

      # Windows App SDK 1.5's MrtCore.PriGen.targets resolves its PRI MSBuild tasks from
      # $(MSBuildExtensionsPath)\Microsoft\VisualStudio\v$(VisualStudioVersion)\AppxPackage\,
      # which only exists in a Visual Studio MSBuild install — never in the standalone .NET
      # SDK that `dotnet publish` runs on, hence MSB4062. Rather than hard-code a VS path
      # (the version folder differs per runner image), find the assembly on this machine and
      # point the targets at it via their documented override properties.
      - name: Locate Windows App SDK PRI MSBuild tooling
        id: pritools
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files\Microsoft Visual Studio',
            'C:\Program Files (x86)\Microsoft Visual Studio'
          ) | Where-Object { Test-Path $_ }

          $dll = $null
          if ($roots) {
            $dll = Get-ChildItem -Path $roots -Recurse -Filter 'Microsoft.Build.Packaging.Pri.Tasks.dll' `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($dll) {
            $dir = $dll.Directory.FullName
            Write-Host "Found PRI MSBuild tasks in: $dir"
            "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "::warning::PRI MSBuild tasks not found; falling back to AppxGeneratePriEnabled=false"
            "dir=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Restore
        run: dotnet restore src/ClearOut/ClearOut.csproj -p:Platform=${{ matrix.platform }}

      - name: Publish (${{ matrix.rid }}, self-contained)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/ClearOut/ClearOut.csproj',
            '-c', 'Release',
            '-r', '${{ matrix.rid }}',
            '-p:Platform=${{ matrix.platform }}',
            '--self-contained', 'true',
            '-p:WindowsAppSDKSelfContained=true',
            '-p:Version=${{ needs.version.outputs.version }}',
            '-o', 'publish/${{ matrix.rid }}'
          )

          $priDir = '${{ steps.pritools.outputs.dir }}'
          if ($priDir) {
            # Both properties are declared with Condition="'$(X)' == ''" in the SDK's
            # targets, so setting them here wins over the VS-relative default.
            $publishArgs += "-p:PriProjTaskAssembly=$priDir\Microsoft.Build.Packaging.Pri.Tasks.dll"
            $publishArgs += "-p:AppxMSBuildTaskAssembly=$priDir\Microsoft.Build.AppxPackage.dll"
          } else {
            # No PRI tooling anywhere on this machine: skip PRI generation entirely so the
            # build still produces a binary. Safe here because the app ships no .resw
            # resources — all its strings live in Strings/AppStrings.cs.
            $publishArgs += '-p:AppxGeneratePriEnabled=false'
          }

          Write-Host "dotnet $($publishArgs -join ' ')"
          dotnet @publishArgs

      # A WinUI app that ships without an app-level PRI fails at startup with no window,
      # which is exactly how v1.0.0-beta1 behaved. Print what actually landed where so a
      # regression here is visible in the log instead of only on a user's machine.
      - name: Verify app PRI is present
        shell: pwsh
        run: |
          Write-Host "--- .pri in publish output ---"
          $published = Get-ChildItem -Path "publish/${{ matrix.rid }}" -Filter *.pri -Recurse -ErrorAction SilentlyContinue
          $published | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "--- .pri in build output (bin) ---"
          Get-ChildItem -Path "src/ClearOut/bin" -Filter *.pri -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

          if (-not ($published | Where-Object { $_.Name -eq 'resources.pri' })) {
            Write-Host "::error::resources.pri missing from the publish output — the app will not start."
            exit 1
          }

      - name: Zip artifact
        shell: pwsh
        run: |
          $zipName = "ClearOut-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zipName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearOut-${{ matrix.rid }}
          path: ClearOut-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    # PR runs are a compile check only — never publish a release from one.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Prerelease vs. stable is driven entirely by whether the version has a "-betaN" suffix,
      # so this one workflow publishes both: a beta as always, or a real stable release (e.g.
      # "1.0.0") by triggering manually with a plain version and no beta suffix.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "${{ contains(needs.version.outputs.version, '-beta') && format('Beta {0}', needs.version.outputs.version) || needs.version.outputs.version }}"
          prerelease: ${{ contains(needs.version.outputs.version, '-beta') }}
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
