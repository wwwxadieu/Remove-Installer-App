name: Build beta release

# Builds a self-contained Windows package and publishes it as a prerelease
# GitHub Release. Two ways to trigger:
#   1. Push a tag matching v*-beta* (e.g. `v1.1.0-beta1`) — fully automatic.
#   2. Run manually from the Actions tab ("Run workflow"), optionally giving
#      an explicit version; if left blank one is generated from the run number.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, e.g. 1.1.0-beta1 (leave blank to auto-generate)"
        required: false
        type: string
  push:
    tags:
      - "v*-beta*"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Compute version
        id: compute
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="0.0.0-beta.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        # win-arm64 is intentionally excluded: as of this writing, GitHub's hosted
        # windows-latest runners fail MRT Core's PRI-generation MSBuild task for arm64
        # (Microsoft.Build.Packaging.Pri.Tasks.dll can't be resolved) when multiple .NET
        # SDKs are installed side by side on the image — an upstream Windows App SDK /
        # runner-image tooling issue, not something in this project. arm64 still builds
        # fine locally from real Visual Studio; re-add it here if/when that's fixed.
        include:
          - rid: win-x64
            platform: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/RemoveInstallerApp/RemoveInstallerApp.csproj -p:Platform=${{ matrix.platform }}

      - name: Publish (${{ matrix.rid }}, self-contained)
        run: >
          dotnet publish src/RemoveInstallerApp/RemoveInstallerApp.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Zip artifact
        shell: pwsh
        run: |
          $zipName = "RemoveInstallerApp-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zipName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoveInstallerApp-${{ matrix.rid }}
          path: RemoveInstallerApp-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Beta ${{ needs.version.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
